<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片</title>
  <!-- 連結 CSS 樣式檔案 -->
  <link rel="stylesheet" href="style.css">
  <!-- 導入免費的 Google 圓潤好看字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>https://i.postimg.cc/vTvd34cs/hellokitty.jpg

  <!-- 名片主體卡片 -->
  <main class="card">
    
    <!-- 1.  -->
    <!-- 提示：可將 src 換成你自己的照片檔名或網址 -->
    <img src="https://i.postimg.cc/vTvd34cs/hellokitty.jpg" alt="https://i.postimg.cc/vTvd34cs/hellokitty.jpg" class<https://i.postimg.cc/vTvd34cs/hellokitty.jpg>

    <!-- 2. 名字與簡短自我介紹 -->
    <h1 class="name">瓊秋</h1>
    <p class="bio">✨ 不懂程式但熱愛設計的視覺新手 ｜ 用色彩記錄生活</p>

    <!-- 3. 按鈕區塊 -->
    <div class="button-group">
      <!-- 提示：把 href="" 裡面的連結換成你的 IG 與 Email 即可 -->
      <a href="https://instagram.com" target="_blank" class="btn btn-instagram">
        <span>Instagram</span>
      </a>
      <a href="mailto:example@gmail.com" class="btn btn-email">
        <span>Email 聯絡我</span>
      </a>
    </div>

  </main>

</body>
</html>
